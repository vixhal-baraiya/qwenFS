[project]
name = "qwenfs"
version = "0.1.0"
description = "A filesystem compiled into the weights of a stock Qwen3.5 model"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.30",
    "numpy>=1.26",
    "safetensors>=0.4",
    "torch>=2.8",
    "transformers>=5.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qfs"]

[tool.ruff]
line-length = 100
